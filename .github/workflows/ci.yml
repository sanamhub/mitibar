name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny,cargo-nextest
      - run: cargo xtask ci

  # Reproducible light and dark snapshots, written by the app itself (Slint's
  # Window::take_snapshot), uploaded as artifacts. Ubuntu renders under xvfb; macOS and
  # Windows runners have a desktop session.
  snapshot:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfontconfig1-dev libdbus-1-dev libgl1 libegl1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: Render light snapshot (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo run --features snapshot -- --font-test --snapshot snapshot-light.png --theme light
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Render dark snapshot (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo run --features snapshot -- --font-test --snapshot snapshot-dark.png --theme dark
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Render light snapshot (macOS, Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo run --features snapshot -- --font-test --snapshot snapshot-light.png --theme light
      - name: Render dark snapshot (macOS, Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo run --features snapshot -- --font-test --snapshot snapshot-dark.png --theme dark
      - name: Render bar snapshots (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($theme in @('light','dark')) {
            foreach ($lang in @('en','ne')) {
              foreach ($scale in @('1','1.5','2')) {
                cargo run --features snapshot -- --bar-snapshot "bar-$theme-$lang-$scale.png" --bar-theme $theme --lang $lang --scale $scale
              }
            }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ matrix.os }}
          path: |
            snapshot-light.png
            snapshot-dark.png
            bar-*.png
          if-no-files-found: error

  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1


