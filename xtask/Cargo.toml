[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
# Icon generation: resvg re-exports usvg and tiny-skia. Both crates are already in the tree
# through Slint, so this adds no new crate. Text is off: every template carries paths.
resvg = { version = "=0.48.1", default-features = false }
# Outlines the digits from the bundled fonts. Digits are paths in every source file, not live
# text, so a build on a machine without the fonts renders the same shapes.
ttf-parser = "=0.25.1"

# Process memory, CPU time and thread count for the idle harness. Windows-only and xtask-only,
# the same `windows` family the app uses (ADR-0005); it never reaches a shipped binary.
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
